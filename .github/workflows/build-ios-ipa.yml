name: Build NekoDX 1.70 Native iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Xcode project
        uses: actions/checkout@v4

      - name: Reassemble static libraries & fix executable permissions
        run: |
          cat Libraries/libiPhone-lib.a.part* > Libraries/libiPhone-lib.a
          cat Libraries/libil2cpp.a.part* > Libraries/libil2cpp.a
          rm -f Libraries/*.part*
          ls -lh Libraries/libiPhone-lib.a Libraries/libil2cpp.a
          find . -maxdepth 2 -name "*.sh" -exec chmod +x {} + || true
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/il2cpp || true
          chmod +x Il2CppOutputProject/IL2CPP/build/deploy_arm64/bee_backend/mac-arm64/bee_backend || true

      - name: Build unsigned iOS arm64 app with Xcode (Metal + IL2CPP)
        run: |
          xcodebuild \
            -project Unity-iPhone.xcodeproj \
            -scheme Unity-iPhone \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath build \
            build

      - name: Package core unsigned IPA (without 619MB Data/ for fast download)
        run: |
          mkdir -p Payload
          APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cp -R "$APP_PATH" Payload/NekoDX.app
          zip -qry NekoDX-1.70-CoreBinary.ipa Payload
          ls -lh NekoDX-1.70-CoreBinary.ipa

      - name: Upload NekoDX-1.70-CoreBinary.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NekoDX-1.70-CoreBinary-IPA
          path: NekoDX-1.70-CoreBinary.ipa
